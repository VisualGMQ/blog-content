<div id="pixi-{{ .Get `id` }}" class="pixi-container" style="max-width:{{ .Get `width` | default `400` }}px; width:100%; aspect-ratio:{{ .Get `width` | default `400` }}/{{ .Get `height` | default `300` }}; margin:0 auto; overflow:hidden;"></div>

{{ if not (.Page.Scratch.Get "pixi_script_loaded") }}
{{ .Page.Scratch.Set "pixi_script_loaded" true }}
<script defer src="{{ `js/lib/pixi.min.js` | relURL }}"></script>
{{ end }}

<script defer src="{{ .Get `src` }}"></script>
